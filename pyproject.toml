[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ragconnect-resume-parser"
version = "0.2.0"
description = "Production-oriented document ingestion and retrieval foundation for RAG systems."
authors = [{name = "Mohammad Sefidgar"}]
dependencies = [
    "pypdf",
    "python-docx",
    "google-genai",
    "python-dotenv",
    "tqdm",
    "reportlab"
]
requires-python = ">=3.9"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
