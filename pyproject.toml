[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragconnect-resume-parser"
version = "0.2.1"
description = "Production-oriented document ingestion and retrieval foundation for RAG systems."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Mohammad Sefidgar" }]
dependencies = [
    "pypdf",
    "python-docx",
    "google-genai",
    "python-dotenv",
    "tqdm",
    "reportlab",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["rag*", "resume_parser*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
